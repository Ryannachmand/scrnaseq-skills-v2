          "KeyF":  "#C9A0DC"
          "KeyG":  "#3D405B"
          "KeyH":  "#4A7C59"
          "KeyI":  "#6B8F71"
          "KeyJ":  "#7B6888"
          "KeyK":  "#B8860B"
          "KeyL":  "#DAA520"
          "KeyM":  "#81B29A"
          "KeyN":  "#9E9E9E"
          "KeyO":  "#B0C4DE"
          "KeyP":  "#D4A5A5"
          "KeyQ":  "#4ECDC4"
          "KeyR":  "#45B7D1"
          "KeyS":  "#2196A8"
          "KeyT":  "#A0785A"
        group_colors:
          "KeyA": "#F4A460"
          "KeyB": "#CD853F"
          "KeyC": "#DEB887"
          "KeyD": "#D2691E"
          "KeyE": "#8B4513"
          "KeyF": "#FFB6C1"
          "KeyG": "#20B2AA"
        ec_subtype_colors:
          "AEC":    "#REPLACE_HEX"
          "CapEC":  "#REPLACE_HEX"
          "CapEC2": "#REPLACE_HEX"
          "VenEC1": "#REPLACE_HEX"
          "VenEC2": "#REPLACE_HEX"
          "VenEC3": "#REPLACE_HEX"
    validated_outputs: []  # see project records
    last_validated: null
    notes: null  # per-project context lives in that project's private CLAUDE.md, not in this registry

  ExampleProject_B:
    status: active
    pipeline: LargeDataset
    inputs:
      type: rds
