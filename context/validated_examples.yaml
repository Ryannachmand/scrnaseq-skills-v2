        - "<YOUR_INPUT_PATHS>"
      notes: "Pre-processed normalized objects. Skip QC/normalization/UMAP. Start at annotation."
    context_defaults:
      batch_correction_var: sample
      label_col_whole_object: celltype
      label_col_ec_subset: ec_subtype_final
      sample_col: sample
      group_col: null
      active_assay_visualization: SCT
      active_assay_findmarkers: RNA
      active_assay_cellchat: RNA
      annotation_approach: refine_existing
      umap: pre-computed
      palettes:
        ec_subtype_colors:
          "EC-GC":    "#REPLACE_HEX"
          "EC-AEA":   "#REPLACE_HEX"
          "EC-AVR":   "#REPLACE_HEX"
          "EC-DVR":   "#REPLACE_HEX"
          "EC-LYM":   "#REPLACE_HEX"
          "EC-PTC":   "#REPLACE_HEX"
          "EC-Prolif": "#REPLACE_HEX"
    validated_outputs: []  # see project records
    last_validated: null
    notes: null  # per-project context lives in that project's private CLAUDE.md, not in this registry

  ExampleProject_C:
    status: active
    pipeline: IntegratePublicData
    inputs:
      type: geo
      paths:
        - "<YOUR_GEO_IDS>"
      notes: "Mixed normalization: raw-count datasets get NormalizeData(); pre-normalized datasets go directly into SetAssayData."
    context_defaults:
      batch_correction_var: sample_id
      normalization: mixed
      n_variable_features: 2250
      n_pcs: 30
      clustering_resolution: 0.3
      downsample_ceiling: 100000
      palettes: null
    validated_outputs: []  # see project records
    last_validated: null
    notes: null  # per-project context lives in that project's private CLAUDE.md, not in this registry

  ExampleProject_D:
    status: completed
    pipeline: IntegratePublicData
    inputs:
      type: null
      paths:
        - "<YOUR_INPUT_PATHS>"
      notes: "Multi-source dataset from multiple anatomical sites."
    context_defaults:
      batch_correction_var: sample_id
      label_col: unified_label
      group_col: site
      groups:
        - "GroupA"
        - "GroupB"
        - "GroupC"
