  KidneyNew:
    status: active
    pipeline: LargeDataset
    inputs:
      type: rds
      paths:
        - null  # TODO: fill in actual RDS paths
      notes: "Pre-processed SCT-normalized objects. Skip QC/normalization/UMAP. Start at annotation."
    context_defaults:
      batch_correction_var: sample    # KidneyNew sample column is 'sample' (S1/S2/S3)
      label_col_whole_object: celltype
      label_col_ec_subset: ec_subtype_final   # final column after annotation; ec_subtype at start
      sample_col: sample               # values: S1, S2, S3
      group_col: null                  # TODO: confirm group comparison column for this project
      active_assay_visualization: SCT
      active_assay_findmarkers: RNA    # JoinLayers first, then switch back to SCT
      active_assay_cellchat: RNA
      annotation_approach: refine_existing   # start from existing mylabel, fill NAs only
      umap: pre-computed
      palettes:
        ec_subtype_colors:
          "EC-GC":    "#10B8F5"    # glomerular capillary — cyan/sky blue
          "EC-AEA":   "#ECA7A0"    # ascending thin limb — salmon/coral
          "EC-AVR":   "#A9B100"    # ascending vasa recta — olive green
          "EC-DVR":   "#36E2A6"    # descending vasa recta — mint green
          "EC-LYM":   "#EFADFF"    # lymphatic — soft purple
          "EC-PTC":   "#4B6584"    # peritubular capillary (added post-hoc)
          "EC-Prolif": "#EFADFF"    # proliferating (shares soft purple with EC-LYM in some plots)
    validated_outputs:
      - "Kidney EC subtype annotation (7 subtypes including post-hoc EC-PTC)"
      - "CellChat v2 ligand-receptor analysis (EC-GC + peritubular ECs + stroma/epithelial/MoMF)"
      - "pySCENIC TF regulon analysis (317 regulons identified)"
      - "DE between EC subtypes (marker gene plots)"
    last_validated: "2026-04-10"
    notes: |
      ASSAY SWITCHING IS CRITICAL: SCT for visualization (DimPlot/VlnPlot/dotplots),
      RNA+JoinLayers for FindMarkers/FindAllMarkers, RNA for CellChat. Always restore SCT after RNA steps.
      NA values in mylabel stored as string "NA", not R native NA — check both when filtering.
      EC-PTC subtype added post-hoc via subclustering (seurat_cluster 3, res=0.2, subcluster 3_1,
      991 cells) — CellChat object predates EC-PTC and does not include it.
      CellChat v2 known bugs (use plan("sequential") at top of any CellChat script):
        - netVisual_aggregate(signaling=NULL) fails → use netVisual_circle()
        - netVisual_heatmap annotation bug → replace with custom ggplot heatmap
        - pairLR.use validation precedence bug → bypass with net= parameter
      Kidney EC biology: EC-GC=filtration/VEGF; AEA=metabolic/urea; AVR=fenestrated/countercurrent;
      DVR=oxygen delivery/pericyte-rich; EC-LYM=immune surveillance/interstitial fluid.

  EyePublicData:
    status: active
    pipeline: IntegratePublicData
    inputs:
      type: geo
      paths:
        - GSE183320    # VoigtAMD (~30k cells) — cells×genes CSV format
        - GSE236566    # OcularAtlas (~36k cells) — single merged MTX
        - GSE210543    # CollinDev (~21k cells) — pre-normalized CSV
      notes: "GSE135092 excluded — bulk RNA-seq only (no scRNA deposited on GEO)."
    context_defaults:
      batch_correction_var: sample_id
      normalization: mixed    # GSE183320+GSE236566: raw→NormalizeData; GSE210543: pre-normalized
      n_variable_features: 2250
      n_pcs: 30
      clustering_resolution: 0.3    # exploratory only
      downsample_ceiling: 100000    # only downsample if total > 100k
      palettes: null                # TODO: no established color palette for this project
    validated_outputs:
      - "Harmonized UMAP (~87k cells: VoigtAMD + OcularAtlas + CollinDev)"
      - "Label harmonization YAML for unified cell type vocabulary"
      - "SCENIC TF regulon analysis on EC/AMD subsets (KLF2/SOX9 networks identified)"
    last_validated: null   # TODO: confirm date
    notes: |
      Mixed normalization is valid: raw-count datasets get NormalizeData();
      pre-normalized datasets (no raw counts on GEO) go directly into SetAssayData(layer="data").
      Flag pre-normalized cells with metadata column: pre_normalized = TRUE.
      GSE183320 format: cells×genes CSV; first 8 columns are metadata (barcode, disease_status,
      MMP9_rs4810482, celltype, library, age, sex, PMI); gene expression starts at column 9.
      GSE236566 format: single merged MTX; RPE/choroid cells filtered by barcode name prefix.
      JoinLayers(so, assay="RNA") is MANDATORY before ANY operation on merged objects.
      No SCT normalization — RNA assay only throughout.
      SCENIC on small disease-specific subsets (AMD ECs) is underpowered — cross-dataset
      confounding likely; interpret regulon results cautiously.
      Pipeline is exploratory only; ends at harmonized UMAP. No subset analysis planned.
      Shorthand: VoigtAMD (GSE183320), OcularAtlas (GSE236566), CollinDev (GSE210543).

