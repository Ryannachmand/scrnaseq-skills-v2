---
# Project Registry — validated_examples.yaml — v2
# The deployment agent uses this registry as the per-project source of truth.
---

# Project Registry

Schema for each entry:
#   project_name:       string — unique project key (human-readable)
#   status:             active | completed | archived
#   pipeline:           LargeDataset | IntegratePublicData
#   inputs:
#     type:             h5 | mex | rds | geo
#     paths:            list of paths or GEO IDs
#   context_defaults:   project-specific overrides the deployment agent injects into CLAUDE.md
#     batch_correction_var: overrides lab default (sample_id) if project used different column
#     label_col:        metadata column holding cell type labels
#     sample_col:       metadata column identifying samples
#     group_col:        metadata column holding comparison groups (for DE)
#     palettes:         named vectors — group_colors, subtype_colors, etc.
#     label_order:      ordered character vector of cell type names
#     functional_gene_sets: null here (defined per-analysis in the brief)
#   validated_outputs:  list of figures/analyses confirmed correct by user
#   last_validated:     date (YYYY-MM-DD)
#   notes:              free-form context for the deployment agent

